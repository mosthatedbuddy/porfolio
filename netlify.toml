[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[build.environment]
  NODE_VERSION = "20"

[functions.load-data]
  included_files = []

[functions.save-data]
  included_files = []

[functions.auth-login]
  included_files = []

[functions.auth-setup]
  included_files = []

[build.processing]
  skip_processing = true
